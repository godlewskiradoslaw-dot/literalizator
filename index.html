<style>
/* Układ: jedna kolumna aplikacji — nagłówek, plansza 6×5, klawiatura przypięta na dole */
:root{
  --bg:#eef1ee; --panel:#ffffff; --ink:#18201b; --muted:#5f6b63; --line:#c9d1cb;
  --key:#dbe1dc; --keyink:#18201b;
  --hit:#2f8a4a; --near:#d19a12; --miss:#7a847d; --tileink:#ffffff; --keymiss:#3b423e; --keymissink:#a9b3ac; --keypl:#d8d5be; --lvwon:#d3e8d9; --lvlost:#e2e5e3; --ovbg:rgba(238,241,238,.75);
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#1b211e; --ink:#eef2ef; --muted:#9aa69e; --line:#38423c;
  --key:#4a5550; --keyink:#eef2ef; --hit:#3d9b58; --near:#c8930f; --miss:#4b544e; --keymiss:#0b0e0c; --keymissink:#5c6660; --keypl:#4f5545; --lvwon:#21402b; --lvlost:#2a302d; --ovbg:rgba(18,22,20,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1b211e; --ink:#eef2ef; --muted:#9aa69e; --line:#38423c;
  --key:#4a5550; --keyink:#eef2ef; --hit:#3d9b58; --near:#c8930f; --miss:#4b544e; --keymiss:#0b0e0c; --keymissink:#5c6660; --keypl:#4f5545; --lvwon:#21402b; --lvlost:#2a302d; --ovbg:rgba(18,22,20,.8); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:500px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;gap:6px;padding-block:6px;box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
h1{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:.8rem;margin-top:2px}
.btns{display:flex;gap:6px}
.icon{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;height:36px;padding:0 10px;font:600 .82rem var(--body);cursor:pointer}
.icon:focus-visible,.k:focus-visible,button:focus-visible{outline:3px solid var(--near);outline-offset:2px}
.mode{display:flex;gap:4px;justify-content:center}
.mode button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px;font:600 .8rem var(--body);cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.board{display:grid;grid-template-rows:repeat(6,1fr);gap:5px;width:200px;height:240px;max-width:100%}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.t{border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:var(--tfs,1.5rem);text-transform:uppercase;background:var(--panel);user-select:none}
.t.f{border-color:var(--muted);animation:pop .1s}
.t.hit,.t.near,.t.miss{color:var(--tileink);border-color:transparent}
.t.hit{background:#12a150} .t.near{background:#ff8a00} .t.miss{background:#6b7280}
.t.rev{animation:flip .45s ease}
.row.shake{animation:shake .4s}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes flip{0%{transform:scaleY(.1)}100%{transform:scaleY(1)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.t,.row{animation:none!important}}
.kb{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.kr{display:flex;gap:4px;justify-content:center}
.k{flex:1;min-width:0;max-width:44px;height:46px;border:1.5px solid transparent;border-radius:6px;background:var(--key);color:var(--keyink);font:600 1rem var(--body);text-transform:uppercase;cursor:pointer;padding:0;touch-action:manipulation}
.k.pl{background:var(--keypl)}
.k.wide{max-width:66px;flex:1.5;font-size:.72rem}
.k.hit{background:var(--hit);color:var(--tileink)} .k.near{background:var(--near);color:var(--tileink)} .k.miss{background:var(--keymiss);color:var(--keymissink);text-decoration:line-through}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:20;pointer-events:none}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--ovbg);display:grid;place-items:center;z-index:30;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(100%,380px);max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--display);font-weight:800;margin:0;font-size:1.3rem;text-wrap:balance}
.card p{margin:0;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.72rem;color:var(--muted)}
.dist{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-variant-numeric:tabular-nums}
.dist div{display:flex;gap:6px;align-items:center}
.dist i{background:var(--miss);color:var(--tileink);font-style:normal;padding:1px 6px;border-radius:3px;min-width:18px;text-align:right}
.dist i.now{background:var(--hit)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;border:0;border-radius:8px;padding:11px;font:600 .9rem var(--body);cursor:pointer;background:var(--key);color:var(--keyink)}
.actions button.main{background:var(--hit);color:var(--tileink)}
.ex{display:flex;gap:4px}
.ex .t{width:38px;height:38px;font-size:1.2rem;--tfs:1.2rem}
.answer{font-family:var(--display);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:1.4rem}
.t{position:relative}
.t .v{position:absolute;right:3px;bottom:1px;font:600 calc(var(--tfs,1.5rem)*.34) var(--body);opacity:.8;line-height:1}
.k{position:relative}
.k .v{position:absolute;right:3px;bottom:1px;font-size:.55rem;opacity:.65}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lv{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 2px;text-align:center;cursor:pointer;font:600 .78rem var(--body);display:flex;flex-direction:column;gap:1px}
.lv small{font-weight:400;color:var(--muted);font-size:.68rem}
.lv[aria-current="true"]{border:2px solid var(--ink);padding:5px 3px}
.lv.won{background:var(--lvwon)}
.lv.lost{background:var(--lvlost)}
.lv:disabled{opacity:.45;cursor:default}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--muted)}
.bar b{color:var(--ink);font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:110px}
.week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.week i{display:flex;flex-direction:column-reverse;width:100%;max-width:28px;border-radius:3px;overflow:hidden;background:var(--key);min-height:2px}
.week i s{display:block;text-decoration:none}
.c1{background:var(--hit)} .c2{background:var(--near)} .c3{background:var(--ink)}
.legend{display:flex;gap:10px;font-size:.72rem;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
table.vals{border-collapse:collapse;font-size:.85rem;width:100%}
table.vals td{padding:3px 6px;border-top:1px solid var(--line)}
table.vals td:first-child{font-weight:600;font-variant-numeric:tabular-nums;width:3.5em}
table.vals td:last-child{text-transform:uppercase;letter-spacing:.08em}
.lvres{display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.lvres div{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:4px}
.lvres b{font-variant-numeric:tabular-nums}
.kr.act{gap:6px}
.k.act{max-width:none;height:50px;font:800 1.05rem var(--body);letter-spacing:.06em}
.k.go{flex:3;background:var(--miss);color:var(--tileink)}
.k.go.ready{background:var(--hit)}
.k.del{flex:1;font-size:.9rem}
.bar .last{color:var(--ink);background:var(--near);padding:2px 8px;border-radius:4px;font-weight:800;letter-spacing:.04em}
.toast.big{font-size:1.15rem;padding:12px 22px;top:38%;white-space:nowrap}
.top{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}

.lvt{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1.25;min-width:0;text-align:center}

.ov{background:var(--bg);align-items:start;overflow:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.card{border:0;background:transparent;padding:4px 0;max-height:none;width:min(100%,420px);margin:0 auto}
.step{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.daysum{display:flex;flex-direction:column;gap:6px}

.daysum .w{font-family:var(--display);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.daysum .pt{font-variant-numeric:tabular-nums;font-weight:800}

.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:800;font-size:1.3rem}
.trainlv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.trainlv button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:10px 4px;font:600 .85rem var(--body);cursor:pointer}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font:400 .85rem var(--body);cursor:pointer;align-self:center;padding:6px}
.k.go{max-width:none;flex:2.3;height:46px;font:800 .82rem var(--body);letter-spacing:.03em;background:#6b7280;color:#fff}
.k.go.ready{background:#12a150}
.k.del{max-width:none;flex:1.3;font-size:1.1rem}
.arch{display:flex;flex-direction:column;gap:6px}
.arch button{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;text-align:left;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:600 .9rem var(--body);cursor:pointer}
.arch small{display:block;color:var(--muted);font-weight:400;font-size:.75rem;margin-top:2px}
.arch .dots{letter-spacing:1px;font-size:.9rem;white-space:nowrap}
.arch .pt{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.top{gap:6px}.top .icon{min-width:36px;padding:0 6px}
.k.go{font-size:.74rem;letter-spacing:0}
.mini{grid-column:1/-1;display:flex;flex-direction:column;gap:3px;margin-top:6px}

.timer{align-self:center;text-align:center;font:600 .85rem var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums;max-width:100%}
.timer.warn{background:#ff8a00;color:#fff;border-color:#ff8a00}

.ico{display:inline-block;vertical-align:-3px;flex:none}
.icon{display:inline-flex;align-items:center;justify-content:center;gap:5px;position:relative}

@media (min-width:430px){#bArch .lbl,#bDuel .lbl{display:inline}}
.badge{position:absolute;top:-7px;right:-7px;background:#e5484d;color:#fff;border-radius:999px;font:800 .66rem var(--body);min-width:17px;height:17px;padding:0 4px;box-sizing:border-box;display:grid;place-items:center;line-height:1}

.sq{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:2px;vertical-align:-1px}
.boards{display:flex;flex-direction:column;gap:10px}

.full{background:var(--lvwon);border-radius:8px;padding:8px 12px;font-weight:600;text-align:center}

/* v12: logo w pasku, panel boczny (menu), podsumowanie z paskami, eksport/import */
.brandt{display:flex;gap:2px;justify-content:center}
.brandt i{width:19px;height:19px;border-radius:3px;display:grid;place-items:center;font:800 .74rem var(--display);font-style:normal;color:#fff}
@media (max-width:360px){.brandt i{width:16px;height:16px;font-size:.66rem}}
.top .icon.menu{position:relative}
.mdot{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:#e5484d;border:2px solid var(--bg)}
#side{position:fixed;top:0;bottom:0;left:0;width:260px;max-width:84vw;background:var(--panel);border-right:1px solid var(--line);z-index:36;transform:translateX(-104%);transition:transform .22s ease;display:flex;flex-direction:column;gap:2px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));box-sizing:border-box;overflow:auto;visibility:hidden}
body.side-on #side{transform:none;visibility:visible}
#sideBg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sitem{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--ink);font:600 1rem var(--body);padding:12px 10px;border-radius:8px;cursor:pointer;text-align:left}
.sitem:hover,.sitem:focus-visible{background:var(--key)}
.sitem .badge{position:static;margin-left:auto}
.ssep{border-top:1px solid var(--line);margin:6px 0}
.sfoot{margin-top:auto;font-size:.75rem;color:var(--muted);padding:10px}
@media (min-width:1100px){#sideBg{display:none!important}body.side-on .ov{left:260px}}
.hint{position:fixed;z-index:37;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font:600 .9rem var(--body);max-width:250px;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer;line-height:1.35}
.hint::before{content:"";position:absolute;top:-7px;left:14px;border:7px solid transparent;border-top:0;border-bottom-color:var(--ink)}
.daysum div{grid-template-columns:auto minmax(0,1fr) auto}
.daysum div.lostr .w{color:var(--muted)}
.daysum .pt{white-space:nowrap}
.daysum div[data-tog] .chev{display:inline-block;transition:transform .2s;color:var(--muted)}
.daysum div.openr .chev{transform:rotate(180deg)}
.daysum div[data-play]{cursor:pointer;border-style:dashed}
.daysum .lvn{font-weight:800;font-family:var(--display)}
.boards{width:min(94vw,820px);align-self:center}
@media (min-width:700px){.boards{flex-direction:row;flex-wrap:wrap;justify-content:center}.boards .bl{flex:0 1 200px}.boards .mini i{width:30px;height:30px}}
.mv textarea{width:100%;box-sizing:border-box;font:.78rem ui-monospace,monospace;padding:8px;border:2px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);resize:vertical}
.mvbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.dres{font-size:.8rem;color:var(--muted);display:block;text-align:right}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.pt .ico{margin-right:3px}
.tag{font-size:.68rem;background:var(--key);color:var(--ink);border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:600}
</style>

function confetti(n){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const old=$('fx');if(old)old.remove();
  const c=document.createElement('canvas');c.id='fx';document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d');if(!x)return;
  const cols=['#12a150','#ff8a00','#3b82f6','#e5484d','#f6cf45','#a855f7'];
  const P=[];for(let i=0;i<n;i++)P.push({x:W*(.2+Math.random()*.6),y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*15-5,w:6+Math.random()*6,h:4+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:pick(cols)});
  const t0=performance.now();
  (function step(t){const k=(t-t0)/2800;x.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=Math.max(0,1-k*k);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(k<1)requestAnimationFrame(step);else c.remove()})(t0);
}

  <p class="sub">Dźwięki: wysoki dzwonek za zieloną literę, niższy za pomarańczową, głuche puknięcie za pudło, „bzyczenie” gdy w próbie nic nie trafiłeś, fanfary za odgadnięte hasło i smutna trąbka za przegrany poziom. Wyciszysz je przyciskiem z głośnikiem w prawym górnym rogu.</p>
  <p><b>Menu.</b> Przycisk ☰ w lewym górnym rogu otwiera menu: podsumowanie i wyniki, archiwum, pojedynek, trening, zasady i przenoszenie wyników. Na komputerze menu może stać na stałe z boku planszy.</p>
  <h2>Poziomy i punkty</h2>
  <p>Codziennie są trzy hasła. Każde jest warte więcej punktów, liczonych jak w Scrabble: <b>Poziom 1</b> to słowa za 5–8 pkt, <b>Poziom 2</b> za 9–11 pkt, <b>Poziom 3</b> za 12 pkt i więcej.</p>
  <p>Poziomy idą po kolei: poziom 2 odblokowuje się po odgadnięciu hasła z poziomu 1, a poziom 3 po odgadnięciu hasła z poziomu 2. Na końcu czeka podsumowanie dnia ze statystykami.</p>
  <p><b>Weekendowa niespodzianka.</b> W sobotę i niedzielę, po zakończeniu poziomu 3, gra zaproponuje dodatkowe hasło o trudności poziomu 3. Masz na nie 10 minut na bonus za czas (do 60 pkt) i możesz dorobić sobie ekstra punkty. Jeśli odmówisz, przycisk niespodzianki czeka w podsumowaniu do końca dnia.</p>
  <p><b>Pojedynek.</b> W menu wybierz Pojedynek: wymyśl 5-literowe hasło, a gra zrobi z niego link do wysłania znajomemu (Messenger, SMS, WhatsApp). Znajomy zgaduje Twoje słowo w 6 próbach, bez zegara i jokerów, a potem może odesłać Ci link ze swoim wynikiem i planszą. Pojedynki nie wpływają na punkty gry dnia.</p>
  <p><b>Joker.</b> Na poziomie 2, 3 i w niespodziance możesz odsłonić jedną literę hasła. Jokera dostajesz za polecenie gry znajomemu (jeden na poziom). Odsłonięta litera kosztuje tyle punktów, ile jest warta w Scrabble.</p>
  <p>Wynik = wartość słowa × premia za szybkość: 6 za odgadnięcie w 1. próbie, 5 w 2., i tak dalej do 1 w 6. próbie. Przykład: ŻÓŁTY (17 pkt) odgadnięty w 3. próbie daje 17 × 4 = 68 pkt.</p>
  <p><b>Bonus za czas.</b> Zegar 5:00 rusza po wpisaniu pierwszej litery danego poziomu i nie zatrzymuje się po wyjściu z gry. Bonus maleje płynnie z każdą sekundą: na starcie wynosi 20 pkt na poziomie 1, 40 pkt na poziomie 2 i 60 pkt na poziomie 3, a po 5 minutach spada do zera. Pasek pod zegarem pokazuje, ile jeszcze zostało. Po 5 minutach usłyszysz sygnał i grasz dalej, już bez bonusu za czas.</p>
  <p><b>Medale.</b> Za odgadnięte hasło dostajesz medal: złoty za 1–2 próby, srebrny za 3–4, brązowy za 5–6. Jeśli zgarniesz co najmniej połowę bonusu za czas, dochodzi Błyskawica.</p>
  <p class="sub">Wartości liter (do liczenia punktów):</p>
  <table class="vals">${Object.keys(groups).sort((a,b)=>a-b).map(v=>`<tr><td>${v} pkt</td><td>${groups[v].join(' ')}</td></tr>`).join('')}</table>
  <p class="sub">Trening (w menu i na stronie podsumowania) losuje słowa z wybranego poziomu bez limitu; punkty w treningu się nie liczą.</p>
  <p class="sub">Archiwum (w menu, czerwona liczba to zaległe dni) pozwala zagrać hasła z poprzednich dni. Punkty liczą się do dnia, którego dotyczą.</p>
  <div class="actions"><button class="main" id="aClose">Gramy</button></div><p class="sub" style="text-align:center">Literiada · wersja 12 · 2026-11-11</p>`);

function startResultFromHash(){const m=location.hash.match(/^#r=([A-Za-z0-9_-]+)$/);if(!m)return false;clearHash();
  const o=decObj(m[1]),ok=w=>typeof w==='string'&&/^[a-ząćęłńóśźż]{5}$/.test(w);
  if(!o||!ok(o.w)||!Array.isArray(o.g)){toast('Ten link z wynikiem jest uszkodzony',2600);return true}
  const g=o.g.filter(ok).slice(0,6),won=o.res==='won'&&g.length>0&&g[g.length-1]===o.w,n=String(o.n||'Znajomy').slice(0,20)||'Znajomy',pts=won?pointsFor(o.w,g.length):0;
  const out=store.get('sd2_duels_out',[]);let it=out.find(x=>x.w===o.w);const rr={n,res:won?'won':'lost',tries:g.length,pts,ts:Date.now()};
  if(it){it.r=(it.r||[]).filter(x=>x.n!==n);it.r.unshift(rr)}else out.unshift({w:o.w,ts:Date.now(),r:[rr]});store.set('sd2_duels_out',out.slice(0,50));
  const mini=`<span class="mini">${g.map(w=>{const s=score(w,o.w);return `<span class="mr">${[...w].map((ch,j)=>`<i style="background:${COL[s[j]]}">${ch}</i>`).join('')}</span>`}).join('')}</span>`;
  open(`<div class="step">Pojedynek · wynik od: ${esc(n)}</div><h2>${ic('swords',24)} ${esc(n)}: ${won?'odgadnięte!':'tym razem bez trafienia'}</h2>
  ${won?`<div class="cel">${medal(medalKind(g.length))}<div class="msg">Hasło <span class="answer">${esc(o.w)}</span><small>${g.length}. próba · ${pts} pkt</small></div></div>`:`<p>Twoje hasło <span class="answer">${esc(o.w)}</span> okazało się za trudne: 6 prób bez trafienia.</p>`}
  <div class="boards" style="width:auto"><div class="bl">${mini}</div></div>
  <div class="actions"><button class="main" id="aNewD">${ic('swords',16)} Wyślij kolejną zagadkę</button><button id="aClose">Zamknij</button></div>`);
  $('aNewD').onclick=showDuel;return true}
// ---- Eksport i import wyników (przeprowadzka na inne urządzenie lub nowy adres)
const MV_PRE='LITERIADA1:';
function mvKeys(){const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^(sd2_|lt_)/.test(k))o[k]=localStorage.getItem(k)}}catch(e){}return o}
function b64e(t){const b=new TextEncoder().encode(t);let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s)}
function b64d(t){const s=atob(t);return new TextDecoder().decode(new Uint8Array([...s].map(c=>c.charCodeAt(0))))}
function mvInfo(d){let h={};try{h=JSON.parse(d.sd2_hist||'{}')||{}}catch(e){}const ks=Object.keys(h);return {days:ks.length,pts:ks.reduce((s,k)=>s+(Array.isArray(h[k])?h[k].reduce((a,b)=>a+(+b||0),0):0),0)}}
const mvCode=()=>MV_PRE+b64e(JSON.stringify({v:1,ts:Date.now(),d:mvKeys()}));
function mvParse(t){t=String(t||'').trim();const i=t.indexOf(MV_PRE);if(i<0)return null;try{const o=JSON.parse(b64d(t.slice(i+MV_PRE.length).replace(/[^A-Za-z0-9+/=]/g,'')));return o&&o.d&&typeof o.d==='object'?o:null}catch(e){return null}}
const dni=n=>n===1?'1 dzień':n+' dni';
function showMove(){const me=mvInfo(mvKeys());
  open(`<div class="step">Przenieś wyniki</div><h2>${ic('move',22)} Eksport i import wyników</h2>
  <p>Wyniki zapisują się tylko w tej przeglądarce. Żeby przenieść je na inne urządzenie albo pod nowy adres gry, zrób eksport tutaj, a import tam.</p>
  <div class="mvbox mv"><b>1. Eksport (tu, gdzie masz wyniki)</b><span class="sub">Tutaj: ${dni(me.days)}, razem ${me.pts} pkt.</span>
  <div class="actions"><button class="main" id="mCopy">Kopiuj kod wyników</button><button id="mFile">Pobierz plik</button></div><div id="mOut"></div></div>
  <div class="mvbox mv"><b>2. Import (na nowym miejscu)</b><textarea id="mIn" rows="3" placeholder="Wklej tu kod wyników (zaczyna się od LITERIADA1:)"></textarea>
  <div class="actions"><button class="main" id="mImp">Importuj z kodu</button><button id="mLoad">Wczytaj plik</button></div><input type="file" id="mF" accept=".txt,text/plain" hidden>
  <span class="sub" id="mInfo">Import zastąpi wyniki zapisane na tej stronie.</span></div>
  <div class="actions"><button id="aClose">Zamknij</button></div>`);
  $('mCopy').onclick=()=>{const c=mvCode();const show=()=>{$('mOut').innerHTML='<textarea rows="3" readonly id="mCode"></textarea><span class="sub">Zaznacz i skopiuj kod powyżej.</span>';$('mCode').value=c;$('mCode').select()};
    try{navigator.clipboard.writeText(c).then(()=>{$('mCopy').textContent='Skopiowano ✓';toast('Kod wyników w schowku')},show)}catch(e){show()}};
  $('mFile').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([mvCode()],{type:'text/plain'}));a.download='Literiada_wyniki_'+todayKey()+'.txt';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){toast('Nie udało się zapisać pliku, użyj kopiowania kodu',2600)}};
  $('mLoad').onclick=()=>$('mF').click();
  $('mF').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('mIn').value=String(r.result||'');mvAsk()};r.readAsText(f)};
  $('mImp').onclick=mvAsk}
function mvAsk(){const o=mvParse($('mIn').value);const inf=$('mInfo');
  if(!o){inf.className='dbad';inf.textContent='To nie wygląda na kod wyników Literiady. Sprawdź, czy skopiowałeś całość.';return}
  const nw=mvInfo(o.d),me=mvInfo(mvKeys());
  open(`<h2>Zaimportować wyniki?</h2><p>W kodzie: <b>${dni(nw.days)}, ${nw.pts} pkt</b>${o.ts?' (eksport z '+new Date(o.ts).toLocaleDateString('pl-PL')+')':''}.</p>
  ${me.days?`<p>Wyniki zapisane teraz na tej stronie (${dni(me.days)}, ${me.pts} pkt) zostaną zastąpione.</p>`:'<p>Na tej stronie nie ma jeszcze wyników.</p>'}
  <div class="actions"><button class="main" id="mYes">Tak, importuj</button><button id="mNo">Anuluj</button></div>`);
  $('mNo').onclick=showMove;
  $('mYes').onclick=()=>{try{Object.keys(mvKeys()).forEach(k=>localStorage.removeItem(k));for(const k in o.d)if(/^(sd2_|lt_)/.test(k)&&typeof o.d[k]==='string')localStorage.setItem(k,o.d[k]);localStorage.setItem('sd2_seen','true');localStorage.setItem('sd2_hint_menu','true')}catch(e){toast('Nie udało się zapisać wyników',2600);return}
    close();setMode('day');toast('Wyniki zaimportowane: '+dni(nw.days)+', '+nw.pts+' pkt',2600)}}
// ---- Panel boczny (menu)
const mqWide=window.matchMedia?matchMedia('(min-width:1100px)'):{matches:false};
const isWide=()=>mqWide.matches;
function sideSet(on,save){document.body.classList.toggle('side-on',on);$('sideBg').hidden=!on||isWide();$('bMenu').setAttribute('aria-expanded',String(on));
  if(save&&isWide())store.set('sd2_side',on);updBadge();setTimeout(fitBoard,260)}
function sideGo(fn){return()=>{if(!isWide())sideSet(false);fn()}}
function menuHint(){if(store.get('sd2_hint_menu',false)||!$('ov').hidden)return;store.set('sd2_hint_menu',true);
  if(document.body.classList.contains('side-on'))return;
  const b=$('bMenu').getBoundingClientRect(),h=document.createElement('div');h.className='hint';h.setAttribute('role','status');
  h.innerHTML='Nowość: tu jest menu z archiwum, wynikami, pojedynkami i treningiem.';h.style.top=(b.bottom+10)+'px';h.style.left=Math.max(8,b.left)+'px';
  const rm=()=>h.remove();h.onclick=rm;$('bMenu').addEventListener('click',rm,{once:true});document.body.appendChild(h);setTimeout(rm,9000)}
function showTrain(){open(`<div class="step">Trening</div><h2>${ic('train',22)} Trening</h2>${trainPicker()}<div class="actions"><button id="aClose">Zamknij</button></div>`);bindTrain()}
function newFree(){const pool=L[freeLvl];let a;do{a=pool[Math.floor(Math.random()*pool.length)]}while(a===answer);answer=a;guesses=[];cur='';done=false;paint();fitBoard()}
function setMode(m){mode=m;close();endDuel();
  if(m==='day'){loadDay();loadDayLevel()}else{freeLvl=lvl;newFree()}}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.body.classList.contains('side-on')&&!isWide()){sideSet(false);return}
  if(!$('ov').hidden){if(e.key==='Escape')close();return}
  if(e.ctrlKey||e.metaKey)return;
  if(e.key==='Enter'){e.preventDefault();press('ENTER')}
  else if(e.key==='Backspace')press('⌫');
  else if(e.key.length===1)press(e.key.toLowerCase());
});
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')close()});
$('bMenu').innerHTML=ic('menu',22)+'<span class="mdot" id="mDot" hidden></span>';$('bMenu').onclick=()=>sideSet(!document.body.classList.contains('side-on'),true);
$('sClose').innerHTML=ic('back',20);$('sClose').onclick=()=>sideSet(false,true);$('sideBg').onclick=()=>sideSet(false);$('sLogo').innerHTML=brandT();
$('sStats').innerHTML=ic('chart',20)+'Podsumowanie i wyniki';$('sStats').onclick=sideGo(()=>{if(mode==='free')setMode('day');showStats()});
$('sArch').innerHTML=ic('cal',20)+'Archiwum<span class="badge" id="arBadge" hidden></span>';$('sArch').onclick=sideGo(showArchive);
$('sDuel').innerHTML=ic('swords',20)+'Pojedynek';$('sDuel').onclick=sideGo(showDuel);
$('sTrain').innerHTML=ic('train',20)+'Trening';$('sTrain').onclick=sideGo(showTrain);
$('sHelp').innerHTML=ic('help',20)+'Jak grać';$('sHelp').onclick=sideGo(showHelp);
$('sMove').innerHTML=ic('move',20)+'Przenieś wyniki';$('sMove').onclick=sideGo(showMove);
if(mqWide.addEventListener)mqWide.addEventListener('change',()=>sideSet(isWide()&&store.get('sd2_side',true)));
if(isWide()&&store.get('sd2_side',true))sideSet(true);
$('bJoker').onclick=jokerClick;$('bSnd').onclick=()=>{SFX.unlock();SFX.toggle();sndIcon()};sndIcon();$('bStats').onclick=()=>{setMode('day');toast('Wracasz do haseł dnia')};
buildBoard();buildKb();loadDay();loadDayLevel();fitBoard();addEventListener('resize',fitBoard);if(window.visualViewport)visualViewport.addEventListener('resize',fitBoard);setTimeout(fitBoard,300);
updBadge();
if(startDuelFromHash()||startResultFromHash()){store.set('sd2_seen',true)}
else if(!store.get('sd2_seen',false)){store.set('sd2_seen',true);showHelp()}
else if(done3(day)&&lvl!==3)showStats();
else setTimeout(menuHint,800);
addEventListener('hashchange',()=>{if(/^#p=/.test(location.hash)){close();startDuelFromHash()}else if(/^#r=/.test(location.hash)){close();startResultFromHash()}});
</script>

</body>
